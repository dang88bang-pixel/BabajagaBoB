# Temporäre Diagnose, Stufe 2: `tests/security/device-attestation.test.ts` ist in
# CI rot (alle 20 übrigen Security-Dateien sind grün, auch einzeln gefahren).
# Die Protokolle sind nicht lesbar, also fährt diese Matrix **jede Prüfung der
# Datei als eigenen Job** — über eine ASCII-benannte Kopie
# (`tests/security/diag-device.test.ts`), damit der Jobstatus die Prüfung nennt.
#
# `ganze-datei` fährt die Originaldatei als Kontrolle: Ist sie rot, aber jede
# einzelne Prüfung grün, hängt der Fehler an der Reihenfolge, nicht an einem Fall.
#
# Beide Dateien werden entfernt, sobald die Ursache behoben ist.
name: Diagnose Security-Suite

on:
  push:
    branches: ["arena/01a0e394-babajagabob"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bob-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prüfung:
    name: Fall ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case:
          - t01
          - t02
          - t03
          - t04
          - t05
          - t06
          - t07
          - t08
          - t09
          - t10
          - t11
          - t12
          - t13
          - t14
          - t15
          - t16
          - t17
          - t18
          - t19
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Nur diese Prüfung fahren
        run: npx vitest run tests/security/diag-device.test.ts -t "${{ matrix.case }}" --reporter=verbose

  ganze-datei:
    name: Originaldatei komplett (Kontrolle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Originaldatei fahren
        run: npx vitest run tests/security/device-attestation.test.ts --reporter=verbose
