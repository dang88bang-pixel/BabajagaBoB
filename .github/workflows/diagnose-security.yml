# Temporäre Diagnose: Der Job „Security- und End-to-End-Suite" ist in CI rot,
# die Laufprotokolle sind aber nicht lesbar (sie liegen auf
# *.blob.core.windows.net, das aus der Arbeitsumgebung nicht erreichbar ist;
# die Check-Run-Annotationen liefern nur „Process completed with exit code 1").
#
# Dieser Workflow fährt jede Security-Testdatei in einem eigenen Job und die
# Suite zusätzlich einmal komplett. Damit steht die fehlschlagende Datei im
# **Jobstatus**, der über `GET /actions/runs/{id}/jobs` lesbar ist — ohne
# Protokoll. Ist nur die Gesamtlauf-Job rot, liegt es am Nebenläufigkeitsgrad.
#
# Wird entfernt, sobald die Ursache behoben ist.
name: Diagnose Security-Suite

on:
  push:
    branches: ["arena/01a0e394-babajagabob"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bob-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datei:
    name: Datei ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        file:
          - api-gate.test.ts
          - api-guard.test.ts
          - api-route-contract.test.ts
          - argv-policy.test.ts
          - authority.test.ts
          - broker-scope.test.ts
          - causal-integrity.test.ts
          - creator-login-lockout.test.ts
          - creator-login.test.ts
          - creator-totp.test.ts
          - device-attestation.test.ts
          - device-enrollment.test.ts
          - direct-route-denial.test.ts
          - gate-bypass.test.ts
          - inbox-route.test.ts
          - input-validation.test.ts
          - ops-enforcement.test.ts
          - promotion-gates.test.ts
          - route-guards.test.ts
          - token-read-projection.test.ts
          - token-replay.test.ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Netzmaske des Runners messen
        run: node -e 'const os=require("os");for(const[n,i]of Object.entries(os.networkInterfaces()))for(const x of i??[])if(x.family==="IPv4")console.log(n,x.address,x.netmask)'
      - name: Nur diese Datei fahren
        run: npx vitest run tests/security/${{ matrix.file }} --reporter=verbose

  komplett:
    name: Suite komplett (wie in CI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Netzmaske des Runners messen
        run: node -e 'const os=require("os");for(const[n,i]of Object.entries(os.networkInterfaces()))for(const x of i??[])if(x.family==="IPv4")console.log(n,x.address,x.netmask)'
      - name: npm run test:security
        run: npm run test:security
