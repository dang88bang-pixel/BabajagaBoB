name: BabajagaBoB CI

# Verifikationspipeline (Abschnitt 35/37):
# BRANCH -> LINT -> TYPECHECK -> UNIT -> INTEGRATION -> SECURITY -> BUILD -> BROWSER
# Der Workflow läuft auf jedem Push (alle Branches) und auf jedem Pull Request,
# damit auch Feature-Branches und der jeweils aktuelle Commit tatsächlich getestet werden.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bob-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI arbeitet ohne externe Provider und ohne Netzwerkzugriff für Sandboxes.
  BOB_SANDBOX_RUNTIME: local
  BOB_CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-and-typecheck:
    name: Lint und Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck

  unit-integration:
    name: Unit- und Integrationstests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit-Tests (Authority, Policy, Governance, Persistenz, Knowledge, Science, Recovery)
        run: npm run test:unit
      - name: Integrationstests (Broker, Runtime, Sandbox, Queue, Runs, Error Intelligence)
        run: npm run test:integration
      - name: Regressionstests
        run: npm run test:regression
      - name: UI-Vertragstests (Control Center, 39 Abschnitte)
        run: npm run test:ui

  security:
    name: Security- und End-to-End-Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security Regression Suite (Privilege Escalation, Token, Kill Switch, Secret Leakage)
        run: npm run test:security
      - name: End-to-End (Creator -> Mission -> ... -> Knowledge)
        run: npm run test:e2e
      - name: Dependency Audit (fail closed on high/critical)
        run: npm audit --audit-level=high

  build:
    name: Produktionsbuild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  verification-gate:
    name: Verification Gate
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-integration, security, build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Abnahmeprüfer (docs/acceptance/requirements.json)
        run: node scripts/acceptance.mjs
      - name: Gate
        run: echo "Alle Verifikationsstufen bestanden. Promotion bleibt manuell und Creator-gebunden."
