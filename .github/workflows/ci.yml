name: BabajagaBoB CI

# Verifikationspipeline (Abschnitt 35/37):
# BRANCH -> LINT -> TYPECHECK -> UNIT -> INTEGRATION -> SECURITY -> SABOTAGE -> BUILD
#   -> FEHLERINJEKTION (echter Prozessabsturz) -> BROWSER
#
# SABOTAGE und FEHLERINJEKTION sind Pflichtstufen: Eine Suite, die eine
# absichtlich entfernte Schutzregel nicht bemerkt, ist kein Nachweis (TEST-004);
# und ein Dienst, dessen Absturz nicht nachweislich überlebt wird, ebenso wenig
# (TEST-003).
# Der Workflow läuft auf jedem Push (alle Branches) und auf jedem Pull Request,
# damit auch Feature-Branches und der jeweils aktuelle Commit tatsächlich getestet werden.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bob-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI arbeitet ohne externe Provider und ohne Netzwerkzugriff für Sandboxes.
  BOB_SANDBOX_RUNTIME: local
  BOB_CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-and-typecheck:
    name: Lint und Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck

  unit-integration:
    name: Unit- und Integrationstests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Der Integrationstest `graceful-shutdown` startet den echten Produktionsserver
      # (`node server.mjs`) und braucht deshalb den Build. Fehlte er, schlug der Job
      # mit "Produktionsbuild fehlt" fehl — laut und mit klarer Ursache statt Timeout.
      - name: Produktionsbuild (Voraussetzung des Prozesstests)
        run: npm run build
      - name: Unit-Tests (Authority, Policy, Governance, Persistenz, Knowledge, Science, Recovery)
        run: npm run test:unit
      - name: Integrationstests (Broker, Runtime, Sandbox, Queue, Runs, Error Intelligence)
        run: npm run test:integration
      - name: Regressionstests
        run: npm run test:regression
      - name: UI-Vertragstests (Control Center, 42 Abschnitte)
        run: npm run test:ui

  sabotage:
    name: Sabotageproben (TEST-004)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Die Probe `SHUTDOWN_SIGNAL_NOT_HANDLED` führt den Prozesstest aus, der den
      # echten Server startet — ohne Build wäre schon die Grundprobe rot.
      - name: Produktionsbuild (Voraussetzung des Prozesstests)
        run: npm run build
      - name: Katalog prüfen (jeder Anker genau einmal, jede Testdatei vorhanden)
        run: node scripts/sabotage.mjs --check
      - name: Sabotageproben (jede geschwächte Regel muss erkannt werden)
        run: node scripts/sabotage.mjs
        env:
          BOB_STORAGE_DIR: ${{ runner.temp }}/bob-sabotage
      - name: Bericht sichern (auch bei Fehlschlag)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sabotage-report
          path: ${{ runner.temp }}/bob-sabotage/sabotage/report.json
          if-no-files-found: warn

  security:
    name: Security- und End-to-End-Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security Regression Suite (Privilege Escalation, Token, Kill Switch, Secret Leakage)
        run: npm run test:security
      - name: End-to-End (Creator -> Mission -> ... -> Knowledge)
        run: npm run test:e2e
      - name: Dependency Audit (fail closed on high/critical)
        run: npm audit --audit-level=high

  build:
    name: Produktionsbuild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fehlerinjektion am laufenden Dienst (SIGKILL, echter Neustart)
        run: node scripts/fault-injection.mjs --cycles=1 --port=3300 --storage=${{ runner.temp }}/bob-crash
      - name: Bericht sichern (auch bei Fehlschlag)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fault-injection-report
          path: ${{ runner.temp }}/bob-crash/fault-injection/report.json
          if-no-files-found: warn

  verification-gate:
    name: Verification Gate
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-integration, sabotage, security, build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Abnahmeprüfer (docs/acceptance/requirements.json)
        run: node scripts/acceptance.mjs
      - name: Gate
        run: echo "Alle Verifikationsstufen bestanden. Promotion bleibt manuell und Creator-gebunden."
